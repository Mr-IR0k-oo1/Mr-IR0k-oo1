  --cell-0: #E8ECF1;
  --cell-1: #B4E5C0;
  --cell-2: #6CD48A;
  --cell-3: #2DB15E;
  --cell-4: #1E8A48;
  --cell-5: #00A64E; 
}
}
text {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  letter-spacing: 0.02em;
}
